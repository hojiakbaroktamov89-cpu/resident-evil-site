<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ movie.title }} — RE Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/re.css">
</head>
<body>
<div class="back-bar">
    <div class="container">
        <a href="{% url 'home' %}" class="btn-back">← Bosh sahifaga qaytish</a>
    </div>
</div>

<div class="container detail-wrap">
    <div class="row g-5">
        <div class="col-md-4">
            {% if movie.image %}
                <img src="{{ movie.image.url }}" alt="{{ movie.title }}" class="detail-img">
            {% else %}
                <div class="detail-no-img">🎬 AFISHA YO'Q</div>
            {% endif %}
        </div>
        <div class="col-md-8">
            <h1 class="detail-title">{{ movie.title }}</h1>
            <p class="detail-year">Chiqish yili: {{ movie.release_year }}</p>
            <div class="detail-divider"></div>
            {% if movie.youtube_url %}
            <p class="detail-label">Rasmiy Treyler</p>
            <div class="yt-wrap mb-3">
                <iframe src="{{ movie.youtube_embed }}"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
            <a href="{{ movie.youtube_url }}" target="_blank" class="btn-re">YouTube'da Ko'rish ↗</a>
            {% endif %}
        </div>
    </div>
</div>

<footer class="re-footer">
    <p>Resident Evil Database © 2024</p>
</footer>
</body>
</html>
