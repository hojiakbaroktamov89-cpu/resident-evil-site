<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ character.name }} — RE Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/re.css">
</head>
<body>
<div class="back-bar">
    <div class="container">
        <a href="{% url 'home' %}" class="btn-back">← Bosh sahifaga qaytish</a>
    </div>
</div>

<div class="container detail-wrap">
    <div class="row g-5">
        <div class="col-md-4">
            {% if character.image %}
                <img src="{{ character.image.url }}" alt="{{ character.name }}" class="detail-img" style="object-position:top;">
            {% else %}
                <div class="detail-no-img">👤 RASM YO'Q</div>
            {% endif %}
        </div>
        <div class="col-md-8">
            <h1 class="detail-title">{{ character.name }}</h1>
            {% if character.games %}
            <p class="detail-label">Qatnashgan o'yinlar</p>
            <div class="char-games mb-3">
                {% for g in character.games_list %}
                <span class="char-game-tag">{{ g }}</span>
                {% endfor %}
            </div>
            {% endif %}
            <div class="detail-divider"></div>
            <p class="detail-label">Biografiya</p>
            <p class="detail-text">{{ character.bio }}</p>
        </div>
    </div>
</div>

<footer class="re-footer">
    <p>Resident Evil Database © 2024</p>
</footer>
</body>
</html>
